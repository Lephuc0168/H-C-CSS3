<!DOCTYPE html>
<html lang="vi">
<head>
    <title>HỒ CÁ CSS3</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hồ cá CSS3 - Bài thi giữa kỳ môn Web">
    <style>
        /* ===== RESET & BODY ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #090a16 0%, #12142e 50%, #08101d 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            color: #fff;
            padding: 20px 0;
        }

        /* ===== APP WRAPPER FOR AUTO ZOOM FIT ===== */
        .app-wrapper {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transform: scale(0.84);
            transform-origin: center top;
            width: 100%; max-width: 1100px;
            margin: -20px 0;
        }

        /* ===== TITLE ===== */
        h1 {
            color: #fff; font-size: 1.9em; margin-bottom: 12px; text-align: center;
            text-shadow: 0 0 20px rgba(0,200,255,0.6), 0 0 40px rgba(0,200,255,0.3);
            animation: titleGlow 3s ease-in-out infinite alternate;
        }
        @keyframes titleGlow {
            0% { text-shadow: 0 0 20px rgba(0,200,255,0.6), 0 0 40px rgba(0,200,255,0.3); }
            100% { text-shadow: 0 0 30px rgba(0,255,200,0.8), 0 0 60px rgba(0,255,200,0.4); }
        }

        /* ===== CONTROL PANEL ===== */
        .controls-wrapper {
            display: flex; flex-direction: column; gap: 8px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 10px 18px;
            margin-bottom: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 900px; width: 95%;
        }

        .control-row {
            display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
        }

        .control-label {
            font-weight: 600; font-size: 0.9em; color: #a5f3fc;
            min-width: 120px; text-align: right; margin-right: 5px;
        }

        .btn-group {
            display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e0f2fe; padding: 6px 14px; border-radius: 20px;
            font-size: 0.85em; font-weight: 500; cursor: pointer;
            transition: all 0.25s ease;
            display: flex; align-items: center; gap: 5px;
            user-select: none;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 200, 255, 0.2);
        }

        .btn.active {
            background: linear-gradient(135deg, #0284c7, #06b6d4);
            border-color: #38bdf8; color: #fff;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            font-weight: 600;
        }

        .btn-action {
            background: rgba(16, 185, 129, 0.2);
            border-color: rgba(52, 211, 153, 0.4);
            color: #a7f3d0;
        }
        .btn-action:hover {
            background: rgba(16, 185, 129, 0.4);
        }

        /* ===== POND CONTAINER ===== */
        #pond {
            position: relative; width: 900px; height: 500px;
            border-radius: 20px; overflow: hidden;
            border: 5px solid #2a6090;
            box-shadow: 0 0 35px rgba(0,150,255,0.4), inset 0 0 60px rgba(0,50,100,0.6);
            transition: background 1s ease, border-color 1s ease;
            cursor: pointer;
        }

        /* BACKGROUND THEMES */
        #pond.bg-deep-ocean {
            background: linear-gradient(180deg, #064273 0%, #0a2e5c 30%, #061a33 70%, #0a1628 100%);
            border-color: #2a6090;
        }
        #pond.bg-coral-reef {
            background: linear-gradient(180deg, #005f73 0%, #0a9396 35%, #001219 85%, #000508 100%);
            border-color: #94d2bd;
        }
        #pond.bg-sunset-pond {
            background: linear-gradient(180deg, #800e13 0%, #ad2831 30%, #38040e 70%, #250209 100%);
            border-color: #ffb703;
        }
        #pond.bg-moss-aquarium {
            background: linear-gradient(180deg, #064e3b 0%, #047857 35%, #022c22 75%, #011913 100%);
            border-color: #34d399;
        }

        /* ===== WATER SHIMMER ===== */
        #pond::before {
            content: ''; position: absolute; top: 0; left: -50%;
            width: 200%; height: 100%; z-index: 10; pointer-events: none;
            background: repeating-linear-gradient(
                90deg,
                transparent, transparent 80px,
                rgba(255,255,255,0.03) 80px, rgba(255,255,255,0.03) 160px
            );
            animation: shimmer 8s linear infinite;
        }
        @keyframes shimmer { 0% { transform: translateX(0); } 100% { transform: translateX(25%); } }

        /* ===== AQUARIUM LIGHTING ===== */
        #pond {
            transition: background 1s ease, border-color 1s ease, filter 0.6s ease, box-shadow 0.6s ease;
        }
        #pond.dark-mode {
            filter: brightness(0.4) contrast(1.2);
            box-shadow: 0 0 15px rgba(0,0,0,0.8), inset 0 0 80px rgba(0,0,0,0.9);
        }

        .light-rays-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9;
            transition: opacity 0.5s ease;
        }
        .light-rays-container.hidden {
            opacity: 0;
        }

        /* Top LED Lamp Glow */
        .top-lamp-glow {
            position: absolute; top: 0; left: 0; width: 100%; height: 70px;
            background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(56,189,248,0.2) 50%, transparent 100%);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        }

        .light-ray {
            position: absolute; top: -10px; height: 120%;
            clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%);
            animation: rayPulse 3.5s ease-in-out infinite alternate;
        }
        .light-ray:nth-child(2) {
            left: 40px; width: 140px;
            background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.12) 65%, transparent 100%);
            transform: skewX(-28deg); animation-delay: 0s;
        }
        .light-ray:nth-child(3) {
            left: 240px; width: 170px;
            background: linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.15) 70%, transparent 100%);
            transform: skewX(-15deg); animation-delay: 1.2s;
        }
        .light-ray:nth-child(4) {
            left: 480px; width: 160px;
            background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.12) 65%, transparent 100%);
            transform: skewX(16deg); animation-delay: 0.7s;
        }
        .light-ray:nth-child(5) {
            left: 680px; width: 140px;
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.08) 60%, transparent 100%);
            transform: skewX(28deg); animation-delay: 2s;
        }
        @keyframes rayPulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* ===== SAND FLOOR ===== */
        .sand {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 60px;
            background: linear-gradient(180deg, #3d2b1f 0%, #5a3d2b 40%, #6b4c3b 100%);
            border-radius: 0 0 15px 15px; z-index: 2;
        }
        .sand::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 15px;
            background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent);
        }

        /* ===== ROCKS ===== */
        .rock {
            position: absolute; bottom: 40px; z-index: 3;
            background: radial-gradient(ellipse at 30% 30%, #5a5a5a, #2a2a2a);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
        }
        .rock.r1 { left: 50px; width: 50px; height: 35px; }
        .rock.r2 { left: 750px; width: 65px; height: 40px; }
        .rock.r3 { left: 400px; width: 40px; height: 28px; }

        /* ===== PLANTS (seaweed) ===== */
        .plant {
            position: absolute; bottom: 50px; z-index: 3; width: 20px;
        }
        .plant .leaf {
            width: 14px; height: 60px; border-radius: 50% 50% 0 0;
            background: linear-gradient(to top, #0a5c2a, #15a34a);
            position: absolute; bottom: 0; transform-origin: bottom center;
            animation: sway 3s ease-in-out infinite;
        }
        .plant .leaf:nth-child(2) { height: 75px; left: 8px; animation-delay: 0.5s; background: linear-gradient(to top, #0a5c2a, #22c55e); }
        .plant .leaf:nth-child(3) { height: 50px; left: -6px; animation-delay: 1s; }
        .plant.p1 { left: 80px; }
        .plant.p2 { left: 200px; }
        .plant.p3 { left: 700px; }
        .plant.p4 { left: 820px; }
        .plant.p3 .leaf { background: linear-gradient(to top, #2d5a27, #4ade80); height: 80px; }
        .plant.p4 .leaf { height: 45px; }
        @keyframes sway {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        /* ===== BUBBLES ===== */
        .bubble {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5), rgba(255,255,255,0.1));
            border: 1px solid rgba(255,255,255,0.3);
            z-index: 8; animation: rise linear infinite;
        }
        .bubble.b1 { width: 8px; height: 8px; left: 120px; bottom: 60px; animation-duration: 6s; }
        .bubble.b2 { width: 5px; height: 5px; left: 300px; bottom: 60px; animation-duration: 8s; animation-delay: 2s; }
        .bubble.b3 { width: 10px; height: 10px; left: 550px; bottom: 60px; animation-duration: 7s; animation-delay: 1s; }
        .bubble.b4 { width: 6px; height: 6px; left: 700px; bottom: 60px; animation-duration: 9s; animation-delay: 3s; }
        .bubble.b5 { width: 7px; height: 7px; left: 450px; bottom: 60px; animation-duration: 5s; animation-delay: 4s; }
        .bubble.b6 { width: 4px; height: 4px; left: 830px; bottom: 60px; animation-duration: 7s; animation-delay: 2.5s; }
        @keyframes rise {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-420px) translateX(20px); opacity: 0; }
        }

        /* ===== FISH FOOD ===== */
        .food-pellet {
            position: absolute; width: 6px; height: 6px; background: #fbbf24;
            border-radius: 50%; z-index: 7;
            box-shadow: 0 0 6px #f59e0b;
            animation: sinkFood 3s linear forwards;
        }
        @keyframes sinkFood {
            0% { opacity: 1; transform: translateY(0); }
            90% { opacity: 1; }
            100% { opacity: 0; transform: translateY(350px); }
        }

        /* =================================================== */
        /* ===== 5 SPECIES OF DISTINCT FISH MODELS (CSS) ===== */
        /* =================================================== */

        .fish {
            position: absolute; z-index: 5;
            animation-timing-function: linear;
        }

        /* ===== SPECIES 1: CÁ CHÉP KOI (ORANGE KOI) ===== */
        #fish1 { animation: swim1 13s linear infinite; }
        #fish1 .fish-body {
            position: relative; width: 68px; height: 30px;
            background: radial-gradient(circle at 70% 30%, #fff 15%, transparent 16%),
                        radial-gradient(circle at 40% 60%, #ea580c 25%, transparent 26%),
                        linear-gradient(135deg, #ff7800, #ffb347, #e11d48);
            border-radius: 50% 40% 40% 50% / 50% 50% 50% 50%;
            animation: bodyWobble 2s ease-in-out infinite;
        }
        /* Eye */
        #fish1 .fish-body::before {
            content: ''; position: absolute; width: 8px; height: 8px;
            background: #fff; border-radius: 50%; top: 7px; left: 50px; z-index: 2;
            box-shadow: inset 2px 0 0 2px #111;
        }
        /* Whiskers (Barbels) */
        #fish1 .fish-body::after {
            content: ''; position: absolute; width: 8px; height: 4px;
            border-top: 2px solid #ea580c; border-radius: 50% 50% 0 0;
            top: 18px; left: 63px; transform: rotate(15deg);
        }
        #fish1 .fish-tail {
            position: absolute; left: -16px; top: 2px;
            width: 0; height: 0;
            border-top: 13px solid transparent; border-bottom: 13px solid transparent;
            border-left: 20px solid #ff7800;
            animation: tailWag 0.35s ease-in-out infinite alternate;
        }
        #fish1 .fish-fin-top {
            position: absolute; top: -10px; left: 22px; width: 0; height: 0;
            border-left: 10px solid transparent; border-right: 10px solid transparent;
            border-bottom: 14px solid #ea580c; opacity: 0.9;
        }
        #fish1 .fish-fin-side {
            position: absolute; bottom: -5px; left: 28px; width: 0; height: 0;
            border-left: 7px solid transparent; border-right: 7px solid transparent;
            border-top: 10px solid #ea580c; opacity: 0.8;
        }

        @keyframes swim1 {
            0%   { left: 20px;  top: 100px; transform: scaleX(1); }
            49.9%{ left: 810px; top: 140px; transform: scaleX(1); }
            50%  { left: 810px; top: 140px; transform: scaleX(-1); }
            99.9%{ left: 20px;  top: 100px; transform: scaleX(-1); }
            100% { left: 20px;  top: 100px; transform: scaleX(1); }
        }

        /* ===== SPECIES 2: CÁ ĐĨA / CÁ TIÊN (BLUE ANGELFISH) ===== */
        #fish2 { animation: swim2 16s linear infinite; }
        #fish2 .fish-body {
            position: relative; width: 44px; height: 55px;
            background: repeating-linear-gradient(
                90deg,
                #0284c7, #0284c7 8px,
                #38bdf8 8px, #38bdf8 16px,
                #0f172a 16px, #0f172a 20px
            );
            border-radius: 50% 50% 50% 50% / 35% 35% 65% 65%;
            animation: bodyWobble 2.4s ease-in-out infinite;
        }
        #fish2 .fish-body::before {
            content: ''; position: absolute; width: 7px; height: 7px;
            background: #facc15; border-radius: 50%; top: 14px; left: 28px; z-index: 2;
            box-shadow: inset 2px 0 0 2px #000;
        }
        #fish2 .fish-body::after {
            content: ''; position: absolute; width: 4px; height: 4px;
            background: #0284c7; border-radius: 50%; top: 26px; left: 38px;
        }
        /* Long trailing vertical fins */
        #fish2 .fish-fin-top {
            position: absolute; top: -32px; left: 12px; width: 0; height: 0;
            border-left: 8px solid transparent; border-right: 4px solid transparent;
            border-bottom: 36px solid #0284c7;
        }
        #fish2 .fish-fin-side {
            position: absolute; bottom: -32px; left: 12px; width: 0; height: 0;
            border-left: 8px solid transparent; border-right: 4px solid transparent;
            border-top: 36px solid #0284c7;
        }
        #fish2 .fish-tail {
            position: absolute; left: -15px; top: 17px; width: 0; height: 0;
            border-top: 10px solid transparent; border-bottom: 10px solid transparent;
            border-left: 18px solid #38bdf8;
            animation: tailWag 0.5s ease-in-out infinite alternate;
        }

        @keyframes swim2 {
            0%   { left: 820px; top: 240px; transform: scaleX(-1); }
            49.9%{ left: 20px;  top: 170px; transform: scaleX(-1); }
            50%  { left: 20px;  top: 170px; transform: scaleX(1); }
            99.9%{ left: 820px; top: 240px; transform: scaleX(1); }
            100% { left: 820px; top: 240px; transform: scaleX(-1); }
        }

        /* ===== SPECIES 3: CÁ MẬP NHỎ (BABY SHARK) ===== */
        #fish3 { animation: swim3 11s linear infinite; }
        #fish3 .fish-body {
            position: relative; width: 80px; height: 28px;
            background: linear-gradient(180deg, #334155 0%, #64748b 55%, #f1f5f9 60%, #f8fafc 100%);
            border-radius: 60% 40% 35% 60% / 60% 50% 50% 60%;
            animation: bodyWobble 1.5s ease-in-out infinite;
        }
        /* Fierce eye */
        #fish3 .fish-body::before {
            content: ''; position: absolute; width: 7px; height: 7px;
            background: #000; border-radius: 50%; top: 8px; left: 62px; z-index: 2;
            box-shadow: 0 0 2px #fff;
        }
        /* Shark Gill slits */
        #fish3 .fish-body::after {
            content: ''; position: absolute; width: 10px; height: 10px;
            border-right: 2px solid #334155; border-left: 2px solid #334155;
            top: 9px; left: 45px; opacity: 0.6;
        }
        /* Sharp Shark Dorsal Fin */
        #fish3 .fish-fin-top {
            position: absolute; top: -20px; left: 30px; width: 0; height: 0;
            border-left: 15px solid transparent; border-right: 8px solid transparent;
            border-bottom: 22px solid #334155; transform: rotate(-10deg);
        }
        #fish3 .fish-fin-side {
            position: absolute; bottom: -8px; left: 35px; width: 0; height: 0;
            border-left: 10px solid transparent; border-right: 6px solid transparent;
            border-top: 12px solid #475569;
        }
        /* Forked Shark Tail */
        #fish3 .fish-tail {
            position: absolute; left: -18px; top: -4px; width: 0; height: 0;
            border-top: 18px solid transparent; border-bottom: 18px solid transparent;
            border-left: 22px solid #334155;
            clip-path: polygon(0 0, 100% 50%, 0 100%, 40% 50%);
            animation: tailWag 0.3s ease-in-out infinite alternate;
        }

        @keyframes swim3 {
            0%   { left: 400px; top: 340px; transform: scaleX(1); }
            25%  { left: 810px; top: 290px; transform: scaleX(1); }
            25.1%{ left: 810px; top: 290px; transform: scaleX(-1); }
            75%  { left: 20px; top: 360px; transform: scaleX(-1); }
            75.1%{ left: 20px; top: 360px; transform: scaleX(1); }
            99.9%{ left: 400px; top: 340px; transform: scaleX(1); }
            100% { left: 400px; top: 340px; transform: scaleX(1); }
        }

        /* ===== SPECIES 4: CÁ NÓC TRÒN (PUFFERFISH) ===== */
        #fish4 { animation: swim4 19s linear infinite; }
        #fish4 .fish-body {
            position: relative; width: 45px; height: 42px;
            background: radial-gradient(circle at 30% 30%, #fef08a 20%, #eab308 60%, #ca8a04 100%);
            border-radius: 50%;
            box-shadow: inset -3px -3px 6px rgba(0,0,0,0.2);
            animation: pufferPuff 1.8s ease-in-out infinite alternate;
        }
        @keyframes pufferPuff {
            0% { transform: scale(0.95); }
            100% { transform: scale(1.08); }
        }
        /* Big Cute Eye */
        #fish4 .fish-body::before {
            content: ''; position: absolute; width: 11px; height: 11px;
            background: #fff; border-radius: 50%; top: 8px; left: 26px; z-index: 2;
            box-shadow: inset 3px 1px 0 3px #000;
        }
        /* Small pout mouth */
        #fish4 .fish-body::after {
            content: ''; position: absolute; width: 6px; height: 6px;
            background: #f43f5e; border-radius: 50%; top: 20px; left: 39px;
        }
        #fish4 .fish-fin-top {
            position: absolute; top: -6px; left: 12px; width: 10px; height: 8px;
            background: #ca8a04; border-radius: 50% 50% 0 0;
        }
        #fish4 .fish-fin-side {
            position: absolute; bottom: 8px; left: 10px; width: 10px; height: 8px;
            background: #ca8a04; border-radius: 50%; animation: tailWag 0.2s infinite;
        }
        #fish4 .fish-tail {
            position: absolute; left: -10px; top: 14px; width: 0; height: 0;
            border-top: 7px solid transparent; border-bottom: 7px solid transparent;
            border-left: 12px solid #eab308;
            animation: tailWag 0.2s linear infinite alternate;
        }

        @keyframes swim4 {
            0%   { left: 150px; top: 190px; transform: scaleX(1); }
            30%  { left: 820px; top: 110px; transform: scaleX(1); }
            30.1%{ left: 820px; top: 110px; transform: scaleX(-1); }
            80%  { left: 20px;  top: 290px; transform: scaleX(-1); }
            80.1%{ left: 20px;  top: 290px; transform: scaleX(1); }
            99.9%{ left: 150px; top: 190px; transform: scaleX(1); }
            100% { left: 150px; top: 190px; transform: scaleX(1); }
        }

        /* ===== SPECIES 5: CÁ BẢY MÀU / BETTA (FANCY BUTTERFLY TAIL) ===== */
        #fish5 { animation: swim5 10s linear infinite; }
        #fish5 .fish-body {
            position: relative; width: 40px; height: 20px;
            background: linear-gradient(135deg, #ec4899, #a855f7, #6366f1);
            border-radius: 50% 40% 40% 50% / 50% 50% 50% 50%;
            animation: bodyWobble 1.6s ease-in-out infinite;
        }
        #fish5 .fish-body::before {
            content: ''; position: absolute; width: 6px; height: 6px;
            background: #fff; border-radius: 50%; top: 4px; left: 28px; z-index: 2;
            box-shadow: inset 2px 0 0 1px #000;
        }
        /* Giant Flowing Butterfly Tail */
        #fish5 .fish-tail {
            position: absolute; left: -32px; top: -14px;
            width: 38px; height: 42px;
            background: linear-gradient(135deg, rgba(236,72,153,0.85), rgba(168,85,247,0.75), rgba(99,102,241,0.6));
            border-radius: 80% 0 80% 80%;
            transform-origin: right center;
            animation: bettaTail 0.6s ease-in-out infinite alternate;
            box-shadow: 0 0 10px rgba(236,72,153,0.4);
        }
        @keyframes bettaTail {
            0% { transform: rotate(-15deg) scaleY(0.9); }
            100% { transform: rotate(15deg) scaleY(1.1); }
        }
        #fish5 .fish-fin-top {
            position: absolute; top: -12px; left: 10px; width: 18px; height: 14px;
            background: rgba(236,72,153,0.7); border-radius: 80% 80% 0 0;
        }
        #fish5 .fish-fin-side {
            position: absolute; bottom: -10px; left: 12px; width: 14px; height: 12px;
            background: rgba(168,85,247,0.7); border-radius: 0 0 80% 80%;
        }

        @keyframes swim5 {
            0%   { left: 600px; top: 150px; transform: scaleX(-1); }
            30%  { left: 20px; top: 90px;  transform: scaleX(-1); }
            30.1%{ left: 20px; top: 90px;  transform: scaleX(1); }
            80%  { left: 820px; top: 240px; transform: scaleX(1); }
            80.1%{ left: 820px; top: 240px; transform: scaleX(-1); }
            99.9%{ left: 600px; top: 150px; transform: scaleX(-1); }
            100% { left: 600px; top: 150px; transform: scaleX(-1); }
        }

        /* ===== FLOAT ANIMATION for fish ===== */
        .fish { animation-timing-function: linear; }
        .fish-body { animation: bodyWobble 2s ease-in-out infinite; }
        @keyframes bodyWobble {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .hint-text {
            margin-top: 8px; font-size: 0.8em; color: rgba(255,255,255,0.4); text-align: center;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <h1>🐟 HỒ CÁ CSS3 🐟</h1>

        <!-- CONTROLS PANEL -->
        <div class="controls-wrapper">
            <div class="control-row">
                <span class="control-label">🎨 Background:</span>
                <div class="btn-group">
                    <button class="btn btn-bg active" onclick="setBg('bg-deep-ocean', this)">🌊 Biển Đêm</button>
                    <button class="btn btn-bg" onclick="setBg('bg-coral-reef', this)">🪸 San Hô</button>
                    <button class="btn btn-bg" onclick="setBg('bg-sunset-pond', this)">🌅 Hoàng Hôn</button>
                    <button class="btn btn-bg" onclick="setBg('bg-moss-aquarium', this)">🌿 Thủy Sinh</button>
                </div>
            </div>

            <div class="control-row">
                <span class="control-label">🎵 Âm Thanh:</span>
                <div class="btn-group">
                    <button class="btn btn-audio active" onclick="setAudio(0, this)">🔇 Tắt</button>
                    <button class="btn btn-audio" onclick="setAudio(1, this)">🫧 Sóng & Bọt Nước</button>
                    <button class="btn btn-audio" onclick="setAudio(2, this)">🎶 Nhạc Thư Giãn</button>
                    <button class="btn btn-audio" onclick="setAudio(3, this)">🌧️ Tiếng Nước Chảy</button>
                </div>
            </div>

            <div class="control-row">
                <span class="control-label">✨ Hiệu Ứng:</span>
                <div class="btn-group">
                    <button class="btn btn-action" onclick="feedFishCenter()">🍞 Thả Thức Ăn</button>
                    <button class="btn btn-action active" id="btnLight" onclick="toggleLight(this)">💡 Bật/Tắt Đèn</button>
                </div>
            </div>
        </div>

        <!-- POND CONTAINER -->
        <div id="pond" class="bg-deep-ocean" onclick="dropFoodEvent(event)">
            <!-- Light rays -->
            <div class="light-rays-container" id="lightRays">
                <div class="top-lamp-glow"></div>
                <div class="light-ray"></div>
                <div class="light-ray"></div>
                <div class="light-ray"></div>
                <div class="light-ray"></div>
            </div>

            <!-- Fish 1 - Orange Koi -->
            <div class="fish" id="fish1">
                <div class="fish-body">
                    <div class="fish-tail"></div>
                    <div class="fish-fin-top"></div>
                    <div class="fish-fin-side"></div>
                </div>
            </div>

            <!-- Fish 2 - Blue Angelfish -->
            <div class="fish" id="fish2">
                <div class="fish-body">
                    <div class="fish-tail"></div>
                    <div class="fish-fin-top"></div>
                    <div class="fish-fin-side"></div>
                </div>
            </div>

            <!-- Fish 3 - Shark -->
            <div class="fish" id="fish3">
                <div class="fish-body">
                    <div class="fish-tail"></div>
                    <div class="fish-fin-top"></div>
                    <div class="fish-fin-side"></div>
                </div>
            </div>

            <!-- Fish 4 - Pufferfish -->
            <div class="fish" id="fish4">
                <div class="fish-body">
                    <div class="fish-tail"></div>
                    <div class="fish-fin-top"></div>
                    <div class="fish-fin-side"></div>
                </div>
            </div>

            <!-- Fish 5 - Fancy Betta -->
            <div class="fish" id="fish5">
                <div class="fish-body">
                    <div class="fish-tail"></div>
                    <div class="fish-fin-top"></div>
                    <div class="fish-fin-side"></div>
                </div>
            </div>

            <!-- Bubbles -->
            <div class="bubble b1"></div>
            <div class="bubble b2"></div>
            <div class="bubble b3"></div>
            <div class="bubble b4"></div>
            <div class="bubble b5"></div>
            <div class="bubble b6"></div>

            <!-- Plants -->
            <div class="plant p1"><div class="leaf"></div><div class="leaf"></div><div class="leaf"></div></div>
            <div class="plant p2"><div class="leaf"></div><div class="leaf"></div><div class="leaf"></div></div>
            <div class="plant p3"><div class="leaf"></div><div class="leaf"></div><div class="leaf"></div></div>
            <div class="plant p4"><div class="leaf"></div><div class="leaf"></div><div class="leaf"></div></div>

            <!-- Rocks -->
            <div class="rock r1"></div>
            <div class="rock r2"></div>
            <div class="rock r3"></div>

            <!-- Sand -->
            <div class="sand"></div>
        </div>

        <p class="hint-text">💡 Mẹo: Nhấp trực tiếp vào hồ cá để thả hạt thức ăn cho cá!</p>
    </div>

    <!-- JAVASCRIPT FOR AUDIO, BACKGROUND & EFFECTS -->
    <script>
        // Change Background
        function setBg(themeClass, element) {
            const pond = document.getElementById('pond');
            pond.className = themeClass;
            document.querySelectorAll('.btn-bg').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
        }

        // Toggle Light Rays & Night Mode
        function toggleLight(btn) {
            const pond = document.getElementById('pond');
            const lightContainer = document.getElementById('lightRays');
            const isHidden = lightContainer.classList.toggle('hidden');
            pond.classList.toggle('dark-mode', isHidden);
            btn.classList.toggle('active', !isHidden);
        }

        // Drop Food on Click
        function dropFoodEvent(e) {
            const pond = document.getElementById('pond');
            const rect = pond.getBoundingClientRect();
            const scale = rect.width / 900;
            const x = (e.clientX - rect.left) / scale;
            const y = (e.clientY - rect.top) / scale;
            createFoodPellet(x, y);
        }

        function feedFishCenter() {
            createFoodPellet(450, 40);
        }

        function createFoodPellet(x, y) {
            const pond = document.getElementById('pond');
            const pellet = document.createElement('div');
            pellet.className = 'food-pellet';
            pellet.style.left = x + 'px';
            pellet.style.top = y + 'px';
            pond.appendChild(pellet);

            setTimeout(() => {
                pellet.remove();
            }, 3000);
        }

        // WEB AUDIO API SYNTHESIZER (Pure JS, no external files needed)
        let audioCtx = null;
        let currentMode = 0;
        let activeNodes = [];
        let timerId = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function stopAudio() {
            activeNodes.forEach(node => {
                try { node.stop ? node.stop() : node.disconnect(); } catch(e) {}
            });
            activeNodes = [];
            if (timerId) { clearInterval(timerId); timerId = null; }
        }

        function setAudio(mode, element) {
            initAudio();
            stopAudio();
            currentMode = mode;

            document.querySelectorAll('.btn-audio').forEach(b => b.classList.remove('active'));
            element.classList.add('active');

            if (mode === 1) playOceanAndBubbles();
            else if (mode === 2) playRelaxingChimes();
            else if (mode === 3) playWaterStream();
        }

        // Mode 1: Ocean & Bubbles
        function playOceanAndBubbles() {
            // White Noise Generator for Waves
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(300, audioCtx.currentTime);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);

            // LFO for wave modulation
            const lfo = audioCtx.createOscillator();
            lfo.frequency.value = 0.2; // 0.2 Hz waves
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 200;

            lfo.connect(filter.frequency);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            noise.start();
            lfo.start();
            activeNodes.push(noise, lfo, gain);

            // Bubble pops
            timerId = setInterval(() => {
                if (currentMode !== 1) return;
                playBubblePop();
            }, 800);
        }

        function playBubblePop() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const freq = 400 + Math.random() * 600;
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(freq + 400, audioCtx.currentTime + 0.08);

            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.09);
        }

        // Mode 2: Relaxing Lofi Chimes
        function playRelaxingChimes() {
            const notes = [261.63, 329.63, 392.00, 440.00, 523.25, 659.25]; // C E G A C E
            timerId = setInterval(() => {
                if (currentMode !== 2) return;
                const note = notes[Math.floor(Math.random() * notes.length)];
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(note, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.5);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 2.6);
            }, 1200);
        }

        // Mode 3: Water Stream
        function playWaterStream() {
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(800, audioCtx.currentTime);
            filter.Q.setValueAtTime(3.0, audioCtx.currentTime);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            noise.start();
            activeNodes.push(noise, gain);
        }
    </script>
</body>
</html>
